<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f4ee" />
    <title>CantemosTodos</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #f7f4ee;
        color: #1c1c1e;
        font-family: system-ui, sans-serif;
      }
      .logo {
        width: 7.5rem;
        height: 7.5rem;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 10px 28px rgba(44, 44, 44, 0.18);
        animation: pulso 1.8s ease-in-out infinite;
      }
      .barras {
        display: flex;
        align-items: flex-end;
        gap: 6px;
        height: 28px;
      }
      .barras span {
        display: block;
        width: 5px;
        height: 100%;
        border-radius: 999px;
        background: #528a9b;
        transform-origin: center bottom;
        animation: compas 0.9s ease-in-out infinite;
      }
      .barras span:nth-child(2) { animation-delay: 0.15s; }
      .barras span:nth-child(3) { animation-delay: 0.3s; }
      .barras span:nth-child(4) { animation-delay: 0.45s; }
      #status {
        display: none;
        margin: 0;
        max-width: 16rem;
        padding: 0 24px;
        text-align: center;
        line-height: 1.45;
        font-size: 0.95rem;
        color: #6b6560;
      }
      #status.visible { display: block; }
      @keyframes pulso {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.045); }
      }
      @keyframes compas {
        0%, 100% { transform: scaleY(0.35); }
        50% { transform: scaleY(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .logo, .barras span { animation: none; }
        .barras span { transform: scaleY(0.6); }
      }
    </style>
  </head>
  <body>
    <img class="logo" src="/icons/icon-192.png" alt="" />
    <div class="barras" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <p id="status"></p>
    <script>
      (function () {
        var FALLBACK_PATHS = ["/", "/pwa-boot.html", "/~offline", "/salas"];

        function setStatus(text) {
          var node = document.getElementById("status");
          node.textContent = text;
          node.className = "visible";
        }

        function matchCandidates(path) {
          return [path, location.origin + path];
        }

        async function findCachedResponse(preferredPath) {
          if (!("caches" in window)) {
            return null;
          }

          var paths = preferredPath
            ? [preferredPath].concat(
                FALLBACK_PATHS.filter(function (path) {
                  return path !== preferredPath;
                }),
              )
            : FALLBACK_PATHS.slice();

          var cacheNames = await caches.keys();

          for (var i = 0; i < paths.length; i++) {
            for (var j = 0; j < cacheNames.length; j++) {
              var cache = await caches.open(cacheNames[j]);
              var candidates = matchCandidates(paths[i]);

              for (var k = 0; k < candidates.length; k++) {
                var match = await cache.match(candidates[k]);
                if (match) {
                  return match;
                }
              }
            }
          }

          return null;
        }

        async function renderCached(preferredPath) {
          var cached = await findCachedResponse(preferredPath);
          if (!cached) {
            return false;
          }

          var html = await cached.text();
          document.open();
          document.write(html);
          document.close();
          return true;
        }

        function registerWorker() {
          if (!("serviceWorker" in navigator) || !navigator.onLine) {
            return;
          }
          navigator.serviceWorker.register("/serwist/sw.js", { scope: "/" }).catch(function () {});
        }

        async function boot() {
          if (navigator.onLine) {
            registerWorker();
            window.location.replace("/");
            return;
          }

          if (navigator.serviceWorker && navigator.serviceWorker.controller) {
            window.location.replace("/");
            return;
          }

          var rendered = await renderCached("/");
          if (rendered) {
            return;
          }

          setStatus("Sin conexión. Abrila una vez con WiFi para dejarla lista.");
        }

        boot();
      })();
    </script>
  </body>
</html>
